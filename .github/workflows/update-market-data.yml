name: Update market dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 0-5"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update latest market data
        run: python scripts/update_market_data.py

      - name: Verify VIX data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          volatility = next(
              axis for axis in data["axes"]
              if axis["id"] == "volatility"
          )

          vix = next(
              indicator for indicator in volatility["indicators"]
              if indicator["name"] == "VIX"
          )

          assert isinstance(vix["actual"], (int, float)), "VIX actual is not numeric"
          assert isinstance(vix["previous"], (int, float)), "VIX previous is not numeric"
          assert vix["actualDate"], "VIX actualDate is missing"
          assert vix["source"] == "FRED", "VIX source is not FRED"
          assert vix["sourceSeries"] == "VIXCLS", "VIX sourceSeries is not VIXCLS"
          assert vix["status"] in {"positive", "neutral", "negative", "warning-low-volatility"}, "VIX status is invalid"

          for key, value in vix.items():
              assert value is not None, f"VIX {key} is null"

          assert data["freshnessStatus"] == "vix-auto-update-ok", "freshnessStatus was not updated"

          print("Verified VIX data:")
          print(json.dumps(vix, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "Update VIX market data"
            git push
          fi
