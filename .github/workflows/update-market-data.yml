name: Update market dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 0-5"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show files before update
        run: |
          echo "Current directory:"
          pwd
          echo "Root files:"
          ls -la
          echo "Data folder:"
          ls -la data || true
          echo "Scripts folder:"
          ls -la scripts || true
          echo "Current freshnessStatus before update:"
          grep -n '"freshnessStatus"' data/latest.json || true

      - name: Update latest market data
        run: python scripts/update_market_data.py

      - name: Verify updated latest.json
        run: |
          echo "Current freshnessStatus after update:"
          grep -n '"freshnessStatus"' data/latest.json || true

          echo "Check all-axes marker:"
          grep -n "all-axes-auto-update-ok" data/latest.json

          echo "Check VIX source:"
          grep -n "VIXCLS" data/latest.json

          echo "Check actual fields:"
          grep -n '"actual"' data/latest.json | head -20

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Git status before add:"
          git status --short

          git add data/latest.json

          echo "Git status after add:"
          git status --short

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "Update market dashboard data"
            git pull --rebase
            git push
          fi

          echo "Git status after push:"
          git status --short
