name: Update market dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 0-5"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update latest market data
        run: python scripts/update_market_data.py

      - name: Verify updated data
        run: |
          echo "Source markers in data/latest.json:"
          grep -n "FRED VIXCLS\|CNN Fear" data/latest.json || true

          echo "Actual fields in data/latest.json:"
          grep -n '"actual"' data/latest.json || true

          echo "Freshness status:"
          grep -n '"freshnessStatus"' data/latest.json || true

          if ! grep -q "FRED VIXCLS" data/latest.json; then
            echo "ERROR: FRED VIXCLS was not written to data/latest.json"
            exit 1
          fi

          if ! grep -q "CNN Fear & Greed Index" data/latest.json; then
            echo "ERROR: CNN Fear & Greed Index was not written to data/latest.json"
            exit 1
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/latest.json

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "Update market dashboard data"
            git push
          fi
